name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case. What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working. Command-line examples are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
