version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The Polkadot SDK and Subxt crates must move together.
      polkadot-sdk:
        patterns: ["sp-*", "subxt*", "scale-*", "parity-scale-codec", "frame-*"]
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
