# release-plz configuration — see RELEASING.md. Set up like the other Virto crates.
#
# release-plz does not write the changelog: ./CHANGELOG.md is written by git-cliff (cliff.toml) in
# the release workflow, and the GitHub release is created from that curated section. The version is
# bumped from the conventional commit titles on `main`:
#
#   feat!: / fix!: / `BREAKING CHANGE:` footer -> major (minor while the version is 0.x)
#   feat:                                       -> minor (patch while the version is 0.x)
#   anything else                               -> patch
#
# `semver_check` is off: the crate is a CLI, and its library only re-exports the Kreivo API that
# Subxt generates from the bundled metadata, so cargo-semver-checks would flag every runtime upgrade.

[workspace]
changelog_update = false
git_release_enable = false
git_tag_enable = true
git_tag_name = "v{{ version }}"
semver_check = false
pr_name = "chore: release v{{ version }}"
pr_labels = ["release"]
